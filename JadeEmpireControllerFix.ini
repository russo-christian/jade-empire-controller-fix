; Jade Empire Xbox controller overhaul
; Keep this file beside dinput8.dll in the game folder. Restart after editing.
; 1 = enabled, 0 = disabled. Missing or invalid values use the enabled default.

[Controls]
; 1 preserves native keyboard/mouse movement and camera controls.
; 0 applies the exploration movement/camera overhaul to both input methods.
ControllerOnly=1

; Elden Ring-style targeting: flick the right stick left/right in locked combat.
; 0 keeps native right-stick camera input. Trigger targeting works in either mode.
RightStickTargetSwitching=1

[Interface]
; 1 uses the game's controller glyphs and binding-aware English prompts.
; Matching textures in override take priority over the game's base artwork.
; 0 restores the game's original text/button-number labels.
ControllerPrompts=1

[Feedback]
; Vibration for XInput controllers. The in-game Rumble setting must also be on.
; Pause, loading and focus-loss rumble fixes stay active in either mode.
Rumble=1
